plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// Nacte podpisove udaje z keystore.properties (ten soubor NIKDY nedavej do
// gitu ani nikam verejne - obsahuje hesla ke tvemu podpisovemu klici).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.example.cycletracker'
    compileSdk 34

    defaultConfig {
        applicationId "cz.tracer.gpsapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Uprav pripadne, pokud zmenis strukturu na hostingu:
        buildConfigField "String", "API_BASE_URL", "\"https://7x.wz.cz/tracer/api/\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'

    // Poloha
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Mapa (OpenStreetMap, bez API klice)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Lokalni DB
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Sync na pozadi
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Sit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
