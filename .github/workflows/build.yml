name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # umoznuje spustit build rucne tlacitkem na GitHubu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhni kód repozitáře
        uses: actions/checkout@v4

      - name: Nastav JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Over dostupnost Android SDK (uz je na runneru predinstalovane)
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Nastav Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sestav debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Nahraj APK jako výstup buildu (ke stažení)
        uses: actions/upload-artifact@v4
        with:
          name: tracer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
